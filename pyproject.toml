[project]
name = "livekit-voice-agent"
version = "0.1.0"
description = "Universal investment advisor voice agent for LiveKit with cartridge-based client configuration"
authors = [{name = "Development Team"}]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "livekit-agents[openai]~=1.3",
    "livekit-plugins-deepgram>=1.3.11",
    "livekit-plugins-groq",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.3.11",
    "livekit-plugins-silero~=0.2",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.1",
]
